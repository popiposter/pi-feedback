name: Improvement / reusable practice
description: Reusable kit invariant supported by recurrence, measurement or deterministic waste
body:
  - type: markdown
    attributes:
      value: "STOP: no credentials, source, logs, prompts, private repo URLs, local paths, business names/IDs, BookStack content, test data or screenshots containing them. Security details: use private vulnerability reporting."
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction review
      options:
        - label: I reviewed every field and removed private data, URLs, paths, secrets and raw content; this is not a security report.
          required: true
  - type: input
    id: desktop
    attributes:
      label: Public PI / Desktop version
    validations:
      required: true
  - type: input
    id: kit
    attributes:
      label: Development Kit bundle identity
      description: Public content hash only; no private source commit or path.
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: EDT-MCP / relevant tool versions
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Generic capability / route
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Current and expected behavior / reusable invariant
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized reproduction, recurrence or measurement and evidence availability
      description: No raw output or private data. One run does not establish percentage gains. Explain deterministic waste when applicable.
    validations:
      required: true
  - type: dropdown
    id: blocked
    attributes:
      label: Is project delivery blocked?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
